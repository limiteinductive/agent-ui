<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Calendar | Northline Studio</title>
  <script src="https://cdn.jsdelivr.net/gh/limiteinductive/agent-ui@12c1c47/packages/core/dist/agent-ui.js"></script>
  <style>
    /* Size the wrapping columns and keep the seven-day grid readable. */
    .calendar-panel {
      flex-basis: 40rem;
      min-inline-size: 0;
      container-type: inline-size;
    }

    .agenda-panel {
      flex: 1 1 18rem;
      min-inline-size: 0;
    }

    .workspace-photo {
      border-radius: var(--ui-radius-md);
      object-fit: cover;
    }

    .calendar-grid {
      --calendar-line: color-mix(in srgb, var(--ui-ink) 14%, transparent);
      border: 1px solid var(--calendar-line);
      border-radius: var(--ui-radius-md);
      overflow: hidden;
    }

    .weekday {
      padding-block: var(--ui-space-sm);
      text-align: center;
      font-size: .75rem;
      font-weight: 600;
      color: var(--ui-ink-muted);
      background: color-mix(in srgb, var(--ui-ink) 5%, var(--ui-surface));
    }

    .day {
      min-inline-size: 0;
      min-block-size: 6.25rem;
      padding: var(--ui-space-xs);
      border-block-start: 1px solid var(--calendar-line);
      font-size: .8125rem;
    }

    .day + .day {
      border-inline-start: 1px solid var(--calendar-line);
    }

    .day.weekend,
    .day.outside {
      background: color-mix(in srgb, var(--ui-ink) 3%, var(--ui-surface));
    }

    .day.outside {
      color: var(--ui-ink-muted);
    }

    .day-number {
      display: inline-grid;
      place-items: center;
      inline-size: 1.625rem;
      block-size: 1.625rem;
      font-variant-numeric: tabular-nums;
    }

    .day-number[aria-current="date"] {
      border: 1px solid currentColor;
      border-radius: var(--ui-radius-full);
      color: var(--ui-primary);
      font-weight: 700;
    }

    .event-chip {
      display: flex;
      align-items: center;
      gap: var(--ui-space-xs);
      inline-size: 100%;
      min-block-size: 1.75rem;
      padding: var(--ui-space-xs);
      border: 0;
      border-radius: var(--ui-radius-sm);
      background: color-mix(in srgb, var(--event-color) 13%, var(--ui-surface));
      color: var(--ui-ink);
      font: inherit;
      text-align: start;
      cursor: pointer;
    }

    .event-chip:hover {
      background: color-mix(in srgb, var(--event-color) 23%, var(--ui-surface));
    }

    .event-chip:focus-visible {
      outline: 2px solid var(--ui-primary);
      outline-offset: -2px;
    }

    .event-dot {
      flex: 0 0 .5rem;
      block-size: .5rem;
      border-radius: var(--ui-radius-full);
      background: var(--event-color);
    }

    .event-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    [data-kind="team"] { --event-color: #548bd2; }
    [data-kind="design"] { --event-color: #a077db; }
    [data-kind="delivery"] { --event-color: #3b9c7d; }

    .agenda {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .agenda li + li {
      border-block-start: 1px solid color-mix(in srgb, var(--ui-ink) 14%, transparent);
    }

    .agenda-date {
      flex: 0 0 3rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .event-meta {
      color: var(--ui-ink-muted);
    }

    dialog {
      box-sizing: border-box;
      inline-size: min(26rem, calc(100% - 2rem));
    }

    /* Compact event markers retain their full accessible names and open details. */
    @container (max-width: 35rem) {
      .day {
        min-block-size: 4.125rem;
        padding-inline: 0;
      }

      .day-number {
        align-self: center;
      }

      .event-chip {
        justify-content: center;
        inline-size: min(100%, 1.75rem);
        min-block-size: 1.625rem;
        align-self: center;
      }

      .event-label {
        display: none;
      }
    }
  </style>
</head>
<body>
  <ui-page>
    <main>
      <ui-container size="lg">
        <ui-stack gap="lg">
          <header>
            <ui-stack gap="sm">
              <ui-row gap="sm">
                <img
                  class="workspace-photo"
                  src="https://picsum.photos/seed/northline-studio/80/80"
                  alt=""
                  width="40"
                  height="40"
                >
                <strong>Northline Studio</strong>
              </ui-row>
              <h1>Team calendar</h1>
            </ui-stack>
          </header>

          <ui-row wrap align="start" gap="lg">
            <ui-card class="calendar-panel" grow padding="sm" gap="sm" rounded="lg">
              <ui-row wrap justify="space-between" gap="sm" padding="xs">
                <h2 id="month-title" aria-live="polite" aria-atomic="true"></h2>
                <ui-row gap="xs" role="group" aria-label="Calendar navigation">
                  <ui-button id="previous-month" variant="outline" aria-label="Previous month">
                    <span aria-hidden="true">&lsaquo;</span>
                  </ui-button>
                  <ui-button id="current-month" variant="ghost">Today</ui-button>
                  <ui-button id="next-month" variant="outline" aria-label="Next month">
                    <span aria-hidden="true">&rsaquo;</span>
                  </ui-button>
                </ui-row>
              </ui-row>

              <div class="calendar-grid" role="table" aria-labelledby="month-title">
                <ui-grid columns="7" min-item-width="2rem" gap="0" role="row">
                  <span class="weekday" role="columnheader" aria-label="Monday">Mon</span>
                  <span class="weekday" role="columnheader" aria-label="Tuesday">Tue</span>
                  <span class="weekday" role="columnheader" aria-label="Wednesday">Wed</span>
                  <span class="weekday" role="columnheader" aria-label="Thursday">Thu</span>
                  <span class="weekday" role="columnheader" aria-label="Friday">Fri</span>
                  <span class="weekday" role="columnheader" aria-label="Saturday">Sat</span>
                  <span class="weekday" role="columnheader" aria-label="Sunday">Sun</span>
                </ui-grid>
                <div id="calendar-weeks" role="rowgroup"></div>
              </div>
            </ui-card>

            <aside class="agenda-panel" aria-labelledby="agenda-title">
              <ui-card padding="md" gap="sm" rounded="lg">
                <h2 id="agenda-title">Upcoming events</h2>
                <ol class="agenda" id="agenda"></ol>
              </ui-card>
            </aside>
          </ui-row>
        </ui-stack>
      </ui-container>
    </main>
  </ui-page>

  <dialog id="event-details" aria-labelledby="event-title">
    <ui-stack gap="sm">
      <h2 id="event-title"></h2>
      <p id="event-when"></p>
      <p id="event-where"></p>
      <p id="event-description"></p>
      <ui-row justify="end">
        <form method="dialog">
          <ui-button type="submit" variant="outline">Close</ui-button>
        </form>
      </ui-row>
    </ui-stack>
  </dialog>

  <script>
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);

    const monthFormat = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" });
    const shortMonth = new Intl.DateTimeFormat("en-US", { month: "short" });
    const fullDate = new Intl.DateTimeFormat("en-US", { dateStyle: "full" });
    const clockTime = new Intl.DateTimeFormat("en-US", { timeStyle: "short" });

    const events = [
      [-12, 10, 0, "team", "Weekly planning", "Studio room", "Set the week's priorities and confirm project owners."],
      [-8, 14, 0, "design", "Homepage critique", "Figma call", "Review the revised homepage and resolve open layout questions."],
      [-4, 11, 30, "delivery", "Prototype handoff", "Project channel", "Walk engineering through the prototype and share final assets."],
      [-2, 15, 0, "team", "Sprint retro", "Studio room", "Review what helped the team ship and agree on one change for next sprint."],
      [0, 10, 0, "team", "Studio check-in", "Google Meet", "Share progress and flag anything the team can help unblock."],
      [1, 11, 30, "design", "Design review", "Figma call", "Review the onboarding screens and agree on revisions before testing."],
      [3, 14, 0, "team", "Research readout", "Studio room", "Share findings from the latest customer interviews."],
      [5, 9, 30, "delivery", "Release readiness", "Google Meet", "Confirm QA sign-off, release owners, and the rollout plan."],
      [7, 13, 0, "design", "Accessibility review", "Figma call", "Review keyboard navigation and focus states for the new screens."],
      [10, 12, 0, "team", "Team lunch", "Studio kitchen", "Bring lunch and catch up with the product team."],
      [13, 15, 30, "delivery", "Client walkthrough", "Google Meet", "Demo the latest build and capture feedback before delivery."]
    ].map(([offset, hour, minute, kind, title, location, description], id) => ({
      id,
      date: new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset, hour, minute),
      kind,
      title,
      location,
      description
    }));

    const monthTitle = document.querySelector("#month-title");
    const weeks = document.querySelector("#calendar-weeks");
    const agenda = document.querySelector("#agenda");
    const details = document.querySelector("#event-details");

    function dateKey(date) {
      const year = String(date.getFullYear()).padStart(4, "0");
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function localDateTime(date) {
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${dateKey(date)}T${hour}:${minute}`;
    }

    function renderCalendar() {
      const year = visibleMonth.getFullYear();
      const month = visibleMonth.getMonth();
      const leadingDays = (visibleMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const weekCount = Math.ceil((leadingDays + daysInMonth) / 7);
      const todayKey = dateKey(today);
      let markup = "";

      for (let week = 0; week < weekCount; week++) {
        markup += '<ui-grid columns="7" min-item-width="2rem" gap="0" role="row">';

        for (let column = 0; column < 7; column++) {
          const date = new Date(year, month, 1 + week * 7 + column - leadingDays);
          const key = dateKey(date);
          const outside = date.getMonth() !== month;
          const dayEvents = outside ? [] : events.filter(event => dateKey(event.date) === key);

          markup += `
            <ui-stack class="day${column >= 5 ? " weekend" : ""}${outside ? " outside" : ""}"
              gap="xs" role="cell">
              <time class="day-number" datetime="${key}" aria-label="${fullDate.format(date)}"
                ${key === todayKey ? 'aria-current="date"' : ""}>${date.getDate()}</time>
              ${dayEvents.map(event => `
                <button class="event-chip" type="button" data-event-id="${event.id}"
                  data-kind="${event.kind}" aria-haspopup="dialog"
                  aria-label="${event.title}, ${clockTime.format(event.date)}, ${fullDate.format(date)}">
                  <span class="event-dot" aria-hidden="true"></span>
                  <span class="event-label">${event.title}</span>
                </button>
              `).join("")}
            </ui-stack>`;
        }

        markup += "</ui-grid>";
      }

      monthTitle.textContent = monthFormat.format(visibleMonth);
      weeks.innerHTML = markup;
    }

    function renderAgenda() {
      const upcoming = events.filter(event => event.date >= now).slice(0, 5);

      agenda.innerHTML = upcoming.map(event => `
        <li>
          <ui-row align="center" gap="sm" padding="sm">
            <ui-card class="agenda-date" sunken rounded="md" padding="xs" gap="0">
              <time datetime="${dateKey(event.date)}" aria-label="${fullDate.format(event.date)}">
                <small>${shortMonth.format(event.date)}</small><br>
                <strong>${event.date.getDate()}</strong>
              </time>
            </ui-card>
            <ui-stack gap="0">
              <strong>${event.title}</strong>
              <small class="event-meta">
                <time datetime="${localDateTime(event.date)}">${clockTime.format(event.date)}</time>
                · ${event.location}
              </small>
            </ui-stack>
          </ui-row>
        </li>
      `).join("");
    }

    function shiftMonth(offset) {
      visibleMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() + offset, 1);
      renderCalendar();
    }

    document.querySelector("#previous-month").addEventListener("click", () => shiftMonth(-1));
    document.querySelector("#next-month").addEventListener("click", () => shiftMonth(1));
    document.querySelector("#current-month").addEventListener("click", () => {
      visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      renderCalendar();
    });

    weeks.addEventListener("click", (click) => {
      const button = click.target.closest("[data-event-id]");
      if (!button) return;

      const event = events[Number(button.dataset.eventId)];
      document.querySelector("#event-title").textContent = event.title;
      document.querySelector("#event-when").textContent =
        `${fullDate.format(event.date)} · ${clockTime.format(event.date)}`;
      document.querySelector("#event-where").textContent = event.location;
      document.querySelector("#event-description").textContent = event.description;
      details.showModal();
    });

    renderCalendar();
    renderAgenda();
  </script>
</body>
</html>
