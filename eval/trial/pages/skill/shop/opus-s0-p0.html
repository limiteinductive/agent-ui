<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stride Footwear: Men's &amp; Women's Sneakers</title>
  <script src="https://cdn.jsdelivr.net/gh/limiteinductive/agent-ui@12c1c47/packages/core/dist/agent-ui.js"></script>
</head>
<body>
<ui-page>
  <header>
    <ui-container>
      <ui-row justify="space-between" padding="sm">
        <a href="#" aria-label="Stride Footwear home"><strong>STRIDE</strong></a>
        <ui-button variant="primary" rounded id="cart-button" aria-label="Cart, 0 items">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          Cart (<span id="cart-count">0</span>)
        </ui-button>
      </ui-row>
    </ui-container>
  </header>

  <main>
    <ui-container>
      <ui-stack gap="lg" padding="md">
        <ui-stack gap="xs">
          <h1>Running &amp; Everyday Sneakers</h1>
          <p>48 styles · Free shipping on orders over $75</p>
        </ui-stack>

        <ui-card sunken padding="md" aria-label="Filters" role="region">
          <ui-row wrap gap="lg" align="end">
            <ui-stack gap="xs" grow>
              <strong id="size-label">Size (US)</strong>
              <ui-row wrap gap="xs" role="group" aria-labelledby="size-label" id="size-chips">
                <ui-button size="sm" rounded variant="outline" aria-pressed="false">6</ui-button>
                <ui-button size="sm" rounded variant="outline" aria-pressed="false">7</ui-button>
                <ui-button size="sm" rounded variant="outline" aria-pressed="false">8</ui-button>
                <ui-button size="sm" rounded variant="primary" aria-pressed="true">9</ui-button>
                <ui-button size="sm" rounded variant="outline" aria-pressed="false">10</ui-button>
                <ui-button size="sm" rounded variant="outline" aria-pressed="false">11</ui-button>
                <ui-button size="sm" rounded variant="outline" aria-pressed="false">12</ui-button>
                <ui-button size="sm" rounded variant="outline" aria-pressed="false">13</ui-button>
              </ui-row>
            </ui-stack>
            <label>Max price: <output id="price-out" for="price">$180</output>
              <input type="range" id="price" name="max-price" min="40" max="250" step="10" value="180">
            </label>
            <label>Sort by
              <select name="sort" id="sort">
                <option value="featured">Featured</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
                <option value="new">Newest</option>
                <option value="rating">Top rated</option>
              </select>
            </label>
          </ui-row>
        </ui-card>

        <ui-grid max-columns="4" min-item-width="sm" gap="md" id="product-grid"></ui-grid>

        <nav aria-label="Pagination">
          <ui-row wrap gap="xs" justify="center" id="pagination">
            <ui-button size="sm" variant="ghost" data-page="prev" aria-label="Previous page">‹ Prev</ui-button>
            <ui-button size="sm" variant="primary" data-page="1" aria-current="page">1</ui-button>
            <ui-button size="sm" variant="outline" data-page="2">2</ui-button>
            <ui-button size="sm" variant="outline" data-page="3">3</ui-button>
            <ui-button size="sm" variant="outline" data-page="4">4</ui-button>
            <ui-button size="sm" variant="ghost" data-page="next" aria-label="Next page">Next ›</ui-button>
          </ui-row>
        </nav>
        <p id="status" role="status" aria-live="polite"></p>
      </ui-stack>
    </ui-container>
  </main>

  <footer>
    <ui-container>
      <ui-row wrap justify="space-between" padding="md">
        <small>© 2026 Stride Footwear Co.</small>
        <ui-row wrap gap="md"><a href="#">Shipping</a><a href="#">Returns</a><a href="#">Size guide</a></ui-row>
      </ui-row>
    </ui-container>
  </footer>
</ui-page>

<script>
  const products = [
    ["Cloudrunner 3", "Men's road running", 129, "shoe1"],
    ["Aero Knit Trainer", "Women's lightweight", 98, "shoe2"],
    ["Trailhawk GTX", "Waterproof trail", 165, "shoe3"],
    ["Courtside Classic", "Leather low-top", 85, "shoe4"],
    ["Tempo Racer", "Carbon plate racing", 220, "shoe5"],
    ["Daily Comfort Slip-On", "Women's casual", 64, "shoe6"],
    ["Summit Hiker Mid", "Ankle-support hiking", 149, "shoe7"],
    ["Retro 88 Runner", "Suede heritage", 110, "shoe8"],
    ["Flexstep Walker", "Wide-fit walking", 79, "shoe9"],
    ["Street Canvas Hi", "Canvas high-top", 59, "shoe10"],
    ["Velocity Pro", "Stability running", 139, "shoe11"],
    ["Recovery Slide", "Cushioned slide", 42, "shoe12"]
  ];

  const grid = document.getElementById("product-grid");
  grid.innerHTML = products.map(([name, desc, price, seed]) => `
    <ui-card padding="0" gap="0" elevated>
      <img src="https://picsum.photos/seed/${seed}/600/450" alt="${name}, ${desc.toLowerCase()} shoe" width="600" height="450" loading="lazy"
           style="width:100%;height:auto;aspect-ratio:4/3;object-fit:cover">
      <ui-stack gap="sm" padding="md" grow justify="space-between">
        <ui-stack gap="xs">
          <h3>${name}</h3>
          <small>${desc}</small>
        </ui-stack>
        <ui-row justify="space-between" wrap gap="sm">
          <strong>$${price.toFixed(2)}</strong>
          <ui-button variant="primary" size="sm" rounded data-add="${name}">Add to cart</ui-button>
        </ui-row>
      </ui-stack>
    </ui-card>`).join("");

  let cart = 0;
  const countEl = document.getElementById("cart-count");
  const cartBtn = document.getElementById("cart-button");
  const status = document.getElementById("status");
  grid.addEventListener("click", e => {
    const btn = e.target.closest("[data-add]");
    if (!btn) return;
    cart++;
    countEl.textContent = cart;
    cartBtn.setAttribute("aria-label", `Cart, ${cart} item${cart === 1 ? "" : "s"}`);
    status.textContent = `${btn.dataset.add} added to cart.`;
    btn.textContent = "Added ✓";
    setTimeout(() => btn.textContent = "Add to cart", 1200);
  });

  document.getElementById("size-chips").addEventListener("click", e => {
    const chip = e.target.closest("ui-button");
    if (!chip) return;
    const on = chip.getAttribute("aria-pressed") !== "true";
    chip.setAttribute("aria-pressed", on);
    chip.setAttribute("variant", on ? "primary" : "outline");
  });

  const price = document.getElementById("price");
  price.addEventListener("input", () => {
    document.getElementById("price-out").textContent = "$" + price.value;
  });

  let page = 1;
  const pager = document.getElementById("pagination");
  pager.addEventListener("click", e => {
    const btn = e.target.closest("[data-page]");
    if (!btn) return;
    const v = btn.dataset.page;
    page = v === "prev" ? Math.max(1, page - 1) : v === "next" ? Math.min(4, page + 1) : +v;
    pager.querySelectorAll("[data-page]").forEach(b => {
      if (isNaN(+b.dataset.page)) return;
      const cur = +b.dataset.page === page;
      b.setAttribute("variant", cur ? "primary" : "outline");
      cur ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
    });
    status.textContent = `Showing page ${page} of 4.`;
  });
</script>
</body>
</html>
