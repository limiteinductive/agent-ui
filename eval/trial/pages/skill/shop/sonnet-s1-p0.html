<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strideline – Shoes</title>
<script src="https://cdn.jsdelivr.net/gh/limiteinductive/agent-ui@12c1c47/packages/core/dist/agent-ui.js"></script>
</head>
<body>
<ui-page>
  <header>
    <ui-container>
      <ui-row justify="space-between" padding="sm">
        <strong>Strideline</strong>
        <ui-button variant="outline" id="cart-btn" aria-label="Cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 7H6"/></svg>
          Cart (<span id="cart-count">0</span>)
        </ui-button>
      </ui-row>
    </ui-container>
  </header>

  <main>
    <ui-container>
      <ui-stack gap="lg" padding="md">
        <ui-stack gap="xs">
          <h1>Men's &amp; Women's Shoes</h1>
          <p><span id="result-count">12</span> products</p>
        </ui-stack>

        <ui-card padding="md" gap="md" sunken>
          <ui-stack gap="sm">
            <strong>Size (US)</strong>
            <ui-row wrap gap="sm" id="sizes">
              <ui-button size="sm" variant="outline" data-size="6">6</ui-button>
              <ui-button size="sm" variant="outline" data-size="7">7</ui-button>
              <ui-button size="sm" variant="outline" data-size="8">8</ui-button>
              <ui-button size="sm" variant="outline" data-size="9">9</ui-button>
              <ui-button size="sm" variant="outline" data-size="10">10</ui-button>
              <ui-button size="sm" variant="outline" data-size="11">11</ui-button>
              <ui-button size="sm" variant="outline" data-size="12">12</ui-button>
            </ui-row>
          </ui-stack>
          <ui-row wrap gap="lg" align="end">
            <label>Max price: $<output id="price-out">200</output>
              <input type="range" id="price" min="40" max="200" step="10" value="200">
            </label>
            <label>Sort by
              <select id="sort">
                <option value="featured">Featured</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
                <option value="name">Name</option>
              </select>
            </label>
          </ui-row>
        </ui-card>

        <ui-grid min-item-width="sm" max-columns="4" id="grid"></ui-grid>

        <ui-row justify="center" gap="sm" wrap id="pager"></ui-row>
      </ui-stack>
    </ui-container>
  </main>
</ui-page>

<script>
(function () {
  var names = ["Aero Runner","Trailblazer GTX","Metro Low Sneaker","Summit Hiker","Cloudstep Walker","Court Classic","Velocity Pro","Harbor Loafer","Nimbus Trainer","Canyon Boot","Daybreak Slip-On","Apex Basketball"];
  var prices = [120,160,85,145,95,75,180,110,130,170,60,150];
  var sizeSets = [[7,8,9,10],[8,9,10,11,12],[6,7,8,9],[9,10,11,12],[6,7,8,9,10],[7,8,9,10,11],[8,9,10],[7,8,9,10,11],[6,7,8],[9,10,11,12],[6,7,8,9,10,11],[10,11,12]];
  var products = names.map(function (n, i) {
    return { id: i, name: n, price: prices[i], sizes: sizeSets[i], img: "https://picsum.photos/seed/shoe" + (i + 1) + "/400/400" };
  });

  var perPage = 6, page = 1, selected = {}, cart = 0;
  var grid = document.getElementById("grid");
  var pager = document.getElementById("pager");
  var price = document.getElementById("price");
  var sort = document.getElementById("sort");

  function filtered() {
    var max = +price.value;
    var keys = Object.keys(selected);
    var list = products.filter(function (p) {
      return p.price <= max && (!keys.length || keys.some(function (s) { return p.sizes.indexOf(+s) > -1; }));
    });
    if (sort.value === "low") list.sort(function (a, b) { return a.price - b.price; });
    if (sort.value === "high") list.sort(function (a, b) { return b.price - a.price; });
    if (sort.value === "name") list.sort(function (a, b) { return a.name.localeCompare(b.name); });
    return list;
  }

  function render() {
    var list = filtered();
    var pages = Math.max(1, Math.ceil(list.length / perPage));
    if (page > pages) page = pages;
    document.getElementById("result-count").textContent = list.length;
    var slice = list.slice((page - 1) * perPage, page * perPage);
    grid.innerHTML = slice.length ? slice.map(function (p) {
      return '<ui-card padding="0" gap="0" elevated>' +
        '<img src="' + p.img + '" alt="' + p.name + '" width="400" height="400" loading="lazy" style="width:100%;height:auto;aspect-ratio:1;object-fit:cover;display:block">' +
        '<ui-stack gap="sm" padding="md">' +
        '<h3>' + p.name + '</h3>' +
        '<ui-row justify="space-between"><strong>$' + p.price + '</strong><small>Sizes ' + p.sizes[0] + '–' + p.sizes[p.sizes.length - 1] + '</small></ui-row>' +
        '<ui-button variant="primary" data-add="' + p.id + '">Add to cart</ui-button>' +
        '</ui-stack></ui-card>';
    }).join("") : '<p>No shoes match your filters.</p>';

    var html = '<ui-button size="sm" variant="outline" data-page="' + (page - 1) + '"' + (page === 1 ? " disabled" : "") + '>Prev</ui-button>';
    for (var i = 1; i <= pages; i++) {
      html += '<ui-button size="sm" variant="' + (i === page ? "primary" : "outline") + '" data-page="' + i + '">' + i + '</ui-button>';
    }
    html += '<ui-button size="sm" variant="outline" data-page="' + (page + 1) + '"' + (page === pages ? " disabled" : "") + '>Next</ui-button>';
    pager.innerHTML = html;
  }

  document.getElementById("sizes").addEventListener("click", function (e) {
    var b = e.target.closest("ui-button");
    if (!b) return;
    var s = b.dataset.size;
    if (selected[s]) { delete selected[s]; b.setAttribute("variant", "outline"); }
    else { selected[s] = 1; b.setAttribute("variant", "primary"); }
    page = 1; render();
  });
  price.addEventListener("input", function () {
    document.getElementById("price-out").textContent = price.value;
    page = 1; render();
  });
  sort.addEventListener("change", function () { page = 1; render(); });
  grid.addEventListener("click", function (e) {
    var b = e.target.closest("[data-add]");
    if (!b) return;
    cart++;
    document.getElementById("cart-count").textContent = cart;
  });
  pager.addEventListener("click", function (e) {
    var b = e.target.closest("[data-page]");
    if (!b || b.hasAttribute("disabled")) return;
    page = +b.dataset.page; render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  render();
})();
</script>
</body>
</html>
