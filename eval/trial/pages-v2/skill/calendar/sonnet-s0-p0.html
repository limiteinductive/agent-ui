<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Calendar</title>
<script src="https://cdn.jsdelivr.net/gh/limiteinductive/agent-ui@12c1c47/packages/core/dist/agent-ui.js"></script>
</head>
<body>
<ui-page>
  <header>
    <ui-container>
      <ui-row justify="space-between" padding="md">
        <strong>Northwind Team</strong>
        <nav><a href="#">Calendar</a></nav>
      </ui-row>
    </ui-container>
  </header>
  <main>
    <ui-container>
      <ui-stack gap="lg" padding="md">
        <ui-row stack-below="50rem" align="start" gap="lg">
          <ui-card id="calendar" gap="md">
            <ui-row justify="space-between">
              <ui-button id="prev" variant="outline" size="sm" aria-label="Previous month">‹ Prev</ui-button>
              <h2 id="month-title" aria-live="polite">Month</h2>
              <ui-button id="next" variant="outline" size="sm" aria-label="Next month">Next ›</ui-button>
            </ui-row>
            <ui-grid columns="7" gap="xs" min-item-width="0" id="weekdays">
              <small><strong>Mon</strong></small>
              <small><strong>Tue</strong></small>
              <small><strong>Wed</strong></small>
              <small><strong>Thu</strong></small>
              <small><strong>Fri</strong></small>
              <small><strong>Sat</strong></small>
              <small><strong>Sun</strong></small>
            </ui-grid>
            <ui-grid columns="7" gap="xs" min-item-width="0" id="days"></ui-grid>
          </ui-card>

          <ui-card gap="md">
            <h2>Upcoming events</h2>
            <ui-stack gap="md" id="upcoming"></ui-stack>
          </ui-card>
        </ui-row>
      </ui-stack>
    </ui-container>
  </main>
</ui-page>

<script>
(function () {
  var TODAY = new Date(2026, 10, 21);
  var EVENTS = [
    { d: "2026-11-03", t: "10:00", title: "Sprint planning", short: "Sprint", who: "Dana Whitfield", img: 11 },
    { d: "2026-11-05", t: "14:30", title: "Design review: onboarding flow", short: "Design", who: "Priya Nair", img: 12 },
    { d: "2026-11-12", t: "09:30", title: "Quarterly roadmap sync", short: "Roadmap", who: "Marcus Lee", img: 13 },
    { d: "2026-11-12", t: "16:00", title: "1:1 with Sam", short: "1:1", who: "Sam Ortega", img: 14 },
    { d: "2026-11-18", t: "11:00", title: "Customer interview: Acme Co.", short: "Interview", who: "Priya Nair", img: 12 },
    { d: "2026-11-21", t: "10:00", title: "Weekend release window", short: "Release", who: "Ops Team", img: 15 },
    { d: "2026-11-24", t: "13:00", title: "Retro & lunch", short: "Retro", who: "Dana Whitfield", img: 11 },
    { d: "2026-11-26", t: "All day", title: "Thanksgiving (office closed)", short: "Holiday", who: "People Ops", img: 16 },
    { d: "2026-11-30", t: "09:00", title: "Sprint demo", short: "Demo", who: "Marcus Lee", img: 13 },
    { d: "2026-12-02", t: "15:00", title: "Security training", short: "Security", who: "Jo Alvarez", img: 17 },
    { d: "2026-12-08", t: "10:30", title: "Hiring panel: Frontend", short: "Hiring", who: "Sam Ortega", img: 14 },
    { d: "2026-12-17", t: "17:00", title: "Team holiday party", short: "Party", who: "People Ops", img: 16 }
  ];
  var view = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  var days = document.getElementById("days");
  var cal = document.getElementById("calendar");
  var wide = false;

  function key(dt) {
    var m = dt.getMonth() + 1, d = dt.getDate();
    return dt.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (d < 10 ? "0" : "") + d;
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  function render() {
    document.getElementById("month-title").textContent =
      view.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    var offset = (view.getDay() + 6) % 7;
    var start = new Date(view.getFullYear(), view.getMonth(), 1 - offset);
    var html = "";
    for (var i = 0; i < 42; i++) {
      var dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i >= 35 && dt.getMonth() !== view.getMonth()) break;
      var inMonth = dt.getMonth() === view.getMonth();
      var isToday = key(dt) === key(TODAY);
      var evs = EVENTS.filter(function (e) { return e.d === key(dt); });
      var attrs = isToday ? ' variant="primary"' : (inMonth ? "" : " sunken");
      var body = "";
      if (wide) {
        body = evs.slice(0, 2).map(function (e) {
          return "<small><mark title=\"" + esc(e.title) + "\">" + esc(e.short) + "</mark></small>";
        }).join("");
      } else if (evs.length) {
        body = "<small aria-label=\"" + evs.length + " events\">" + "●".repeat(evs.length) + "</small>";
      }
      html += '<ui-card padding="xs" gap="xs" rounded="sm"' + attrs + '>' +
        (isToday ? "<strong>" + dt.getDate() + "</strong>" : "<span>" + dt.getDate() + "</span>") +
        body + "</ui-card>";
    }
    days.innerHTML = html;
  }

  function renderUpcoming() {
    var tk = key(TODAY);
    var list = EVENTS.filter(function (e) { return e.d >= tk; }).slice(0, 6);
    document.getElementById("upcoming").innerHTML = list.map(function (e) {
      var p = e.d.split("-");
      var label = new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      return '<ui-row gap="md">' +
        '<img src="https://picsum.photos/seed/team' + e.img + '/80/80" width="40" height="40" alt="' + esc(e.who) + '" loading="lazy">' +
        '<ui-stack gap="xs" grow><strong>' + esc(e.title) + '</strong>' +
        '<small><time datetime="' + e.d + '">' + label + '</time> · ' + esc(e.t) + ' · ' + esc(e.who) + '</small></ui-stack>' +
        '</ui-row>';
    }).join("<hr>");
  }

  document.getElementById("prev").addEventListener("click", function () {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render();
  });
  document.getElementById("next").addEventListener("click", function () {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render();
  });

  function measure() {
    var w = cal.clientWidth >= 480;
    if (w !== wide) { wide = w; render(); }
  }
  wide = cal.clientWidth >= 480;
  render();
  renderUpcoming();
  if (window.ResizeObserver) new ResizeObserver(measure).observe(cal);
  else window.addEventListener("resize", measure);
})();
</script>
</body>
</html>
