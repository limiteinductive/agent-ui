<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Calendar</title>
<script src="https://cdn.jsdelivr.net/gh/limiteinductive/agent-ui@12c1c47/packages/core/dist/agent-ui.js"></script>
</head>
<body>
<ui-page>
  <header>
    <ui-container>
      <ui-row justify="space-between" padding="md">
        <strong>Northwind Team</strong>
        <nav><a href="#">Calendar</a></nav>
      </ui-row>
    </ui-container>
  </header>
  <main>
    <ui-container>
      <ui-stack gap="lg">
        <h1>Team calendar</h1>
        <ui-row stack-below="md" align="start" gap="lg">
          <ui-card>
            <ui-row justify="space-between">
              <ui-button id="prev" variant="outline" size="sm" aria-label="Previous month">‹ Prev</ui-button>
              <h2 id="month-title">November 2026</h2>
              <ui-button id="next" variant="outline" size="sm" aria-label="Next month">Next ›</ui-button>
            </ui-row>
            <ui-grid id="grid" columns="7" gap="xs"></ui-grid>
            <small>● marks a day with events. Details are listed under Upcoming.</small>
          </ui-card>
          <ui-card sunken>
            <h2>Upcoming</h2>
            <ui-stack id="upcoming" gap="md"></ui-stack>
          </ui-card>
        </ui-row>
      </ui-stack>
    </ui-container>
  </main>
</ui-page>

<script>
(function () {
  var events = [
    { d: "2026-11-21", t: "Design crit", time: "11:00", who: "Maya Chen", img: 64 },
    { d: "2026-11-23", t: "Sprint planning", time: "10:00", who: "Priya Nair", img: 65 },
    { d: "2026-11-23", t: "1:1 with Tom", time: "15:30", who: "Tom Becker", img: 91 },
    { d: "2026-11-25", t: "Customer demo", time: "14:00", who: "Luis Ortega", img: 177 },
    { d: "2026-11-26", t: "Release freeze", time: "09:00", who: "Dana Wright", img: 338 },
    { d: "2026-11-30", t: "Quarterly all-hands", time: "16:00", who: "Sam Okafor", img: 433 },
    { d: "2026-12-02", t: "Retro", time: "13:00", who: "Priya Nair", img: 65 },
    { d: "2026-12-04", t: "Team lunch", time: "12:30", who: "Maya Chen", img: 64 },
    { d: "2026-12-04", t: "Security review", time: "15:00", who: "Dana Wright", img: 338 },
    { d: "2026-12-04", t: "Roadmap sync", time: "17:00", who: "Sam Okafor", img: 433 },
    { d: "2026-12-10", t: "Hiring panel", time: "11:00", who: "Luis Ortega", img: 177 },
    { d: "2026-12-18", t: "Holiday party", time: "18:00", who: "Tom Becker", img: 91 }
  ];
  var today = "2026-11-21";
  var view = new Date(2026, 10, 1);
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var key = function (y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); };

  function render() {
    var y = view.getFullYear(), m = view.getMonth();
    document.getElementById("month-title").textContent = months[m] + " " + y;
    var html = days.map(function (d) { return "<strong>" + d + "</strong>"; }).join("");
    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var count = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < offset; i++) html += "<div></div>";
    for (var d = 1; d <= count; d++) {
      var k = key(y, m, d);
      var evs = events.filter(function (e) { return e.d === k; });
      var dots = evs.length
        ? '<small title="' + evs.map(function (e) { return e.t; }).join(", ") + '">' + "●".repeat(Math.min(evs.length, 3)) + "</small>"
        : "<small>&nbsp;</small>";
      html += '<ui-card padding="xs" gap="0" rounded="sm"' + (k === today ? ' variant="primary"' : "") + ">" +
        "<span>" + (k === today ? "<strong>" + d + "</strong>" : d) + "</span>" + dots + "</ui-card>";
    }
    document.getElementById("grid").innerHTML = html;
  }

  function upcoming() {
    var list = events.filter(function (e) { return e.d >= today; }).slice(0, 6);
    document.getElementById("upcoming").innerHTML = list.map(function (e) {
      var dt = new Date(e.d + "T00:00:00");
      var label = dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      return '<ui-row gap="sm" align="start">' +
        '<img src="https://picsum.photos/id/' + e.img + '/64/64" width="40" height="40" alt="' + e.who + '">' +
        '<ui-stack gap="xs" grow><strong>' + e.t + "</strong>" +
        '<small><time datetime="' + e.d + '">' + label + "</time> · " + e.time + " · " + e.who + "</small></ui-stack></ui-row>";
    }).join("");
  }

  document.getElementById("prev").addEventListener("click", function () { view.setMonth(view.getMonth() - 1); render(); });
  document.getElementById("next").addEventListener("click", function () { view.setMonth(view.getMonth() + 1); render(); });
  render();
  upcoming();
})();
</script>
</body>
</html>
