<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stride & Co. — Shop Sneakers</title>
  <script src="https://cdn.jsdelivr.net/gh/limiteinductive/agent-ui@12c1c47/packages/core/dist/agent-ui.js"></script>
</head>
<body>
  <ui-stack gap="0">
    <!-- Header -->
    <header>
      <ui-container size="lg">
        <ui-stack padding="md">
          <ui-row justify="space-between" align="center" gap="md" wrap>
            <ui-row align="center" gap="sm">
              <strong>Stride &amp; Co.</strong>
            </ui-row>
            <nav aria-label="Main">
              <ui-row gap="md" wrap>
                <a href="#">Men</a>
                <a href="#">Women</a>
                <a href="#">Kids</a>
                <a href="#">Sale</a>
              </ui-row>
            </nav>
            <ui-button variant="outline" id="cart-button" aria-label="Cart">
              🛒 Cart <span id="cart-count">0</span>
            </ui-button>
          </ui-row>
        </ui-stack>
      </ui-container>
      <hr>
    </header>

    <main>
      <ui-container size="lg">
        <ui-stack gap="lg" padding="md">
          <ui-stack gap="xs">
            <h1>Running &amp; Lifestyle Sneakers</h1>
            <p><small>Showing 1–12 of 48 products</small></p>
          </ui-stack>

          <!-- Filter bar -->
          <ui-card padding="md">
            <ui-stack gap="md">
              <ui-stack gap="xs">
                <strong id="size-label">Size (US)</strong>
                <ui-row gap="xs" wrap id="size-chips" role="group" aria-labelledby="size-label">
                  <ui-button variant="outline" size="sm" value="6" aria-pressed="false">6</ui-button>
                  <ui-button variant="outline" size="sm" value="7" aria-pressed="false">7</ui-button>
                  <ui-button variant="outline" size="sm" value="8" aria-pressed="false">8</ui-button>
                  <ui-button variant="primary" size="sm" value="9" aria-pressed="true">9</ui-button>
                  <ui-button variant="outline" size="sm" value="10" aria-pressed="false">10</ui-button>
                  <ui-button variant="outline" size="sm" value="11" aria-pressed="false">11</ui-button>
                  <ui-button variant="outline" size="sm" value="12" aria-pressed="false">12</ui-button>
                  <ui-button variant="outline" size="sm" value="13" aria-pressed="false">13</ui-button>
                </ui-row>
              </ui-stack>

              <ui-row gap="md" wrap align="end">
                <ui-stack gap="xs" grow>
                  <label for="price-range"><strong>Max price: <span id="price-value">$200</span></strong></label>
                  <input type="range" id="price-range" min="40" max="250" step="10" value="200">
                </ui-stack>
                <ui-stack gap="xs" grow>
                  <label for="sort"><strong>Sort by</strong></label>
                  <select id="sort">
                    <option value="featured">Featured</option>
                    <option value="new">Newest</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="rating">Top Rated</option>
                  </select>
                </ui-stack>
                <ui-button variant="ghost" id="clear-filters">Clear filters</ui-button>
              </ui-row>
            </ui-stack>
          </ui-card>

          <!-- Product grid -->
          <ui-grid min-item-width="160px" gap="md" id="product-grid"></ui-grid>

          <!-- Pagination -->
          <nav aria-label="Pagination">
            <ui-row justify="center" gap="xs" wrap>
              <ui-button variant="outline" size="sm" disabled>‹ Prev</ui-button>
              <ui-button variant="primary" size="sm" aria-current="page">1</ui-button>
              <ui-button variant="outline" size="sm">2</ui-button>
              <ui-button variant="outline" size="sm">3</ui-button>
              <ui-button variant="outline" size="sm">4</ui-button>
              <ui-button variant="outline" size="sm">Next ›</ui-button>
            </ui-row>
          </nav>
        </ui-stack>
      </ui-container>
    </main>

    <footer>
      <hr>
      <ui-container size="lg">
        <ui-stack padding="md">
          <ui-row justify="space-between" wrap gap="sm">
            <small>© 2026 Stride &amp; Co. Free shipping on orders over $75.</small>
            <ui-row gap="md">
              <a href="#">Returns</a>
              <a href="#">Size guide</a>
              <a href="#">Contact</a>
            </ui-row>
          </ui-row>
        </ui-stack>
      </ui-container>
    </footer>
  </ui-stack>

  <script>
    const products = [
      { name: "AeroPulse Runner", brand: "Velox", price: 129, seed: "shoe1", tag: "New" },
      { name: "Trailblazer GTX", brand: "Summit", price: 159, seed: "shoe2" },
      { name: "Classic Court Low", brand: "Heritage", price: 89, seed: "shoe3" },
      { name: "CloudStep Knit", brand: "Nimbus", price: 115, seed: "shoe4", tag: "Bestseller" },
      { name: "Urban Glide 2", brand: "Metro", price: 99, seed: "shoe5" },
      { name: "Velocity Pro Carbon", brand: "Velox", price: 219, seed: "shoe6", tag: "New" },
      { name: "Retro Jogger '84", brand: "Heritage", price: 95, seed: "shoe7" },
      { name: "Canvas Slip-On", brand: "Coastline", price: 55, seed: "shoe8", tag: "Sale" },
      { name: "HighTop Street", brand: "Metro", price: 110, seed: "shoe9" },
      { name: "FlexFit Trainer", brand: "Core", price: 85, seed: "shoe10" },
      { name: "Ridge Hiker Mid", brand: "Summit", price: 145, seed: "shoe11" },
      { name: "Marathon Elite", brand: "Nimbus", price: 179, seed: "shoe12", tag: "Bestseller" }
    ];

    const grid = document.getElementById("product-grid");
    const cartCount = document.getElementById("cart-count");
    let cart = 0;

    function render(list) {
      grid.innerHTML = "";
      list.forEach(p => {
        const card = document.createElement("ui-card");
        card.setAttribute("padding", "sm");
        card.innerHTML = `
          <ui-stack gap="sm">
            <img src="https://picsum.photos/seed/${p.seed}/400/400" alt="${p.name} sneaker"
                 width="400" height="400" loading="lazy">
            <ui-stack gap="xs">
              <ui-row justify="space-between" align="center" gap="xs">
                <small>${p.brand}</small>
                ${p.tag ? `<mark>${p.tag}</mark>` : ""}
              </ui-row>
              <strong>${p.name}</strong>
              <span>$${p.price.toFixed(2)}</span>
            </ui-stack>
            <ui-button variant="primary" class="add-btn">Add to cart</ui-button>
          </ui-stack>`;
        card.querySelector(".add-btn").addEventListener("click", e => {
          cart++;
          cartCount.textContent = cart;
          const btn = e.currentTarget;
          btn.textContent = "Added ✓";
          setTimeout(() => (btn.textContent = "Add to cart"), 1200);
        });
        grid.appendChild(card);
      });
      if (!list.length) {
        grid.innerHTML = `<p><small>No shoes match your filters.</small></p>`;
      }
    }

    const range = document.getElementById("price-range");
    const priceValue = document.getElementById("price-value");
    const sort = document.getElementById("sort");

    function apply() {
      const max = +range.value;
      priceValue.textContent = "$" + max;
      let list = products.filter(p => p.price <= max);
      if (sort.value === "price-asc") list.sort((a, b) => a.price - b.price);
      if (sort.value === "price-desc") list.sort((a, b) => b.price - a.price);
      if (sort.value === "new") list.sort((a, b) => (b.tag === "New") - (a.tag === "New"));
      if (sort.value === "rating") list.sort((a, b) => (b.tag === "Bestseller") - (a.tag === "Bestseller"));
      render(list);
    }

    range.addEventListener("input", apply);
    sort.addEventListener("change", apply);

    function setChip(chip, on) {
      chip.setAttribute("aria-pressed", on ? "true" : "false");
      chip.setAttribute("variant", on ? "primary" : "outline");
    }

    const chips = document.querySelectorAll("#size-chips ui-button");
    chips.forEach(chip => {
      chip.addEventListener("click", () => {
        setChip(chip, chip.getAttribute("aria-pressed") !== "true");
      });
    });

    document.getElementById("clear-filters").addEventListener("click", () => {
      chips.forEach(c => setChip(c, false));
      range.value = 250;
      sort.value = "featured";
      apply();
    });

    apply();
  </script>
</body>
</html>
