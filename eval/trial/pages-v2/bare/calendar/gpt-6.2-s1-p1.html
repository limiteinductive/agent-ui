<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team calendar</title>
  <script src="https://cdn.jsdelivr.net/gh/limiteinductive/agent-ui@12c1c47/packages/core/dist/agent-ui.js"></script>
  <style>
    /* Calendar-specific layout and the compact event treatment for phones. */
    .team-calendar {
      box-sizing: border-box;
      max-width: 1200px;
      margin-inline: auto;
      padding: clamp(12px, 3vw, 36px);
    }
    .page-heading h1, .month-bar h2, .agenda h2 { margin: 0; }
    .page-heading p, .agenda > p { margin: 4px 0 0; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.4fr);
      align-items: start;
      gap: 20px;
      margin-top: 24px;
    }
    .workspace > * { min-width: 0; }
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 12px;
    }
    .month-bar h2 { font-size: clamp(1.125rem, 3vw, 1.5rem); }
    .month-controls { display: flex; gap: 6px; }
    .month-controls button {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      font-size: 1.2rem;
    }
    .month-grid {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin: 0;
    }
    .month-grid th, .month-grid td {
      box-sizing: border-box;
      border: 1px solid rgb(128 128 128 / 28%);
      padding: 6px;
    }
    .month-grid th { text-align: center; font-size: 0.75rem; }
    .month-grid td { height: 82px; vertical-align: top; }
    .outside-month { opacity: 0.6; }
    .day-number {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
    }
    .day-number[aria-current="date"] {
      border-radius: 50%;
      background: #4338ca;
      color: white;
      font-weight: 700;
    }
    .day-events, .agenda-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .day-events { display: flex; flex-direction: column; gap: 3px; }
    .event-chip {
      overflow: hidden;
      padding: 2px 4px;
      border-radius: 4px;
      background: var(--event-background);
      color: var(--event-ink);
      font-size: 0.6875rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .planning { --event-background: #e8e7ff; --event-ink: #3730a3; }
    .review { --event-background: #d9f4e9; --event-ink: #075347; }
    .team { --event-background: #ffecd5; --event-ink: #843b12; }
    .agenda { padding: 14px 12px; }
    .agenda-list { margin-top: 14px; }
    .agenda-list li {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding-block: 12px;
      border-top: 1px solid rgb(128 128 128 / 28%);
    }
    .date-badge {
      display: grid;
      place-items: center;
      padding-block: 4px;
      border-radius: 8px;
      background: var(--event-background);
      color: var(--event-ink);
      font-size: 0.75rem;
      line-height: 1.35;
    }
    .date-badge strong { font-size: 1.125rem; }
    .event-details strong, .event-details small { display: block; }
    .event-details small { margin-top: 3px; }
    @media (max-width: 800px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 520px) {
      .month-grid th, .month-grid td { padding: 3px; }
      .month-grid td { height: 51px; }
      .day-events { flex-direction: row; flex-wrap: wrap; gap: 3px; padding: 3px; }
      .event-chip {
        position: relative;
        width: 7px;
        height: 7px;
        padding: 0;
        border-radius: 50%;
        background: var(--event-ink);
      }
      .event-chip span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    }
  </style>
</head>
<body>
  <main class="team-calendar">
    <ui-stack gap="lg">
      <header class="page-heading">
        <h1>Team calendar</h1>
        <p>Product &amp; Design</p>
      </header>

      <div class="workspace">
        <ui-card padding="0">
          <section aria-labelledby="month-title">
            <header class="month-bar">
              <h2 id="month-title" aria-live="polite"></h2>
              <div class="month-controls">
                <button id="previous-month" type="button" aria-label="Previous month">‹</button>
                <button id="next-month" type="button" aria-label="Next month">›</button>
              </div>
            </header>
            <table class="month-grid" aria-labelledby="month-title">
              <thead>
                <tr>
                  <th scope="col" abbr="Monday">Mon</th>
                  <th scope="col" abbr="Tuesday">Tue</th>
                  <th scope="col" abbr="Wednesday">Wed</th>
                  <th scope="col" abbr="Thursday">Thu</th>
                  <th scope="col" abbr="Friday">Fri</th>
                  <th scope="col" abbr="Saturday">Sat</th>
                  <th scope="col" abbr="Sunday">Sun</th>
                </tr>
              </thead>
              <tbody id="month-days"></tbody>
            </table>
          </section>
        </ui-card>

        <ui-card padding="0">
          <aside class="agenda" aria-labelledby="agenda-title">
            <h2 id="agenda-title">Upcoming events</h2>
            <p><small>Pacific time</small></p>
            <ul class="agenda-list" id="agenda-list" aria-labelledby="agenda-title"></ul>
            <p id="empty-agenda" hidden>No events scheduled for this month.</p>
          </aside>
        </ui-card>
      </div>
    </ui-stack>
  </main>

  <script>
    const demoToday = "2026-11-21";
    const events = [
      { date: "2026-10-28", title: "October retrospective", time: "2:00 PM", location: "Maple Room", type: "team" },
      { date: "2026-11-03", title: "Sprint planning", time: "10:00 AM", location: "Maple Room", type: "planning" },
      { date: "2026-11-06", title: "Research readout", time: "11:00 AM", location: "Google Meet", type: "review" },
      { date: "2026-11-12", title: "Roadmap check-in", time: "1:30 PM", location: "Google Meet", type: "planning" },
      { date: "2026-11-18", title: "Design critique", time: "11:00 AM", location: "Studio B", type: "review" },
      { date: "2026-11-23", title: "Sprint planning", time: "10:00 AM", location: "Maple Room", type: "planning" },
      { date: "2026-11-24", title: "Onboarding design review", time: "11:30 AM", location: "Google Meet", type: "review" },
      { date: "2026-11-24", title: "Customer research debrief", time: "2:00 PM", location: "Studio B", type: "review" },
      { date: "2026-11-25", title: "Team lunch", time: "12:00 PM", location: "Ferry Building", type: "team" },
      { date: "2026-11-30", title: "November retrospective", time: "2:00 PM", location: "Maple Room", type: "team" },
      { date: "2026-12-03", title: "December roadmap review", time: "10:00 AM", location: "Maple Room", type: "planning" },
      { date: "2026-12-10", title: "Prototype walkthrough", time: "11:00 AM", location: "Google Meet", type: "review" }
    ];

    const monthFormat = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" });
    const shortMonthFormat = new Intl.DateTimeFormat("en-US", { month: "short" });
    const fullDateFormat = new Intl.DateTimeFormat("en-US", { dateStyle: "full" });
    const monthTitle = document.getElementById("month-title");
    const monthDays = document.getElementById("month-days");
    const agendaTitle = document.getElementById("agenda-title");
    const agendaList = document.getElementById("agenda-list");
    const emptyAgenda = document.getElementById("empty-agenda");
    let visibleMonth = new Date(2026, 10, 1);

    function dateKey(date) {
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day}`;
    }

    function renderMonth() {
      const year = visibleMonth.getFullYear();
      const month = visibleMonth.getMonth();
      const monthKey = dateKey(visibleMonth).slice(0, 7);
      const monthEvents = events.filter(event => event.date.startsWith(monthKey));
      const mondayOffset = (visibleMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cellCount = Math.ceil((mondayOffset + daysInMonth) / 7) * 7;

      monthTitle.textContent = monthFormat.format(visibleMonth);
      monthDays.replaceChildren();

      for (let index = 0; index < cellCount; index += 1) {
        if (index % 7 === 0) monthDays.insertRow();
        const cell = monthDays.rows[monthDays.rows.length - 1].insertCell();
        const date = new Date(year, month, index - mondayOffset + 1);
        const key = dateKey(date);
        const inMonth = date.getMonth() === month;
        const dayNumber = document.createElement("time");

        dayNumber.className = "day-number";
        dayNumber.dateTime = key;
        dayNumber.textContent = date.getDate();
        dayNumber.setAttribute("aria-label", fullDateFormat.format(date));
        if (key === demoToday) dayNumber.setAttribute("aria-current", "date");
        cell.append(dayNumber);

        if (!inMonth) {
          cell.classList.add("outside-month");
          continue;
        }

        const dayEvents = monthEvents.filter(event => event.date === key);
        if (dayEvents.length === 0) continue;

        const list = document.createElement("ul");
        list.className = "day-events";
        for (const event of dayEvents) {
          const chip = document.createElement("li");
          const label = document.createElement("span");
          chip.className = `event-chip ${event.type}`;
          chip.title = `${event.title}, ${event.time}`;
          label.textContent = event.title;
          chip.append(label);
          list.append(chip);
        }
        cell.append(list);
      }

      const demoMonth = demoToday.slice(0, 7);
      const agendaEvents = monthKey === demoMonth
        ? monthEvents.filter(event => event.date >= demoToday)
        : monthEvents;

      agendaTitle.textContent = monthKey < demoMonth ? "Past events" : "Upcoming events";
      agendaList.replaceChildren();
      emptyAgenda.hidden = agendaEvents.length > 0;

      for (const event of agendaEvents) {
        const [eventYear, eventMonth, eventDay] = event.date.split("-").map(Number);
        const date = new Date(eventYear, eventMonth - 1, eventDay);
        const row = document.createElement("li");
        const badge = document.createElement("time");
        const day = document.createElement("strong");
        const monthLabel = document.createElement("span");
        const details = document.createElement("div");
        const title = document.createElement("strong");
        const meta = document.createElement("small");

        badge.className = `date-badge ${event.type}`;
        badge.dateTime = event.date;
        badge.setAttribute("aria-label", fullDateFormat.format(date));
        monthLabel.textContent = shortMonthFormat.format(date);
        day.textContent = eventDay;
        badge.append(monthLabel, day);

        details.className = "event-details";
        title.textContent = event.title;
        meta.textContent = `${event.time} · ${event.location}`;
        details.append(title, meta);
        row.append(badge, details);
        agendaList.append(row);
      }
    }

    function moveMonth(offset) {
      visibleMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() + offset, 1);
      renderMonth();
    }

    document.getElementById("previous-month").addEventListener("click", () => moveMonth(-1));
    document.getElementById("next-month").addEventListener("click", () => moveMonth(1));
    renderMonth();
  </script>
</body>
</html>
